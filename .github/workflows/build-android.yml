name: Build ENGINEX Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check Android app
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Name APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk enginex-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: enginex-android-debug-apk
          path: enginex-android-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enginex-android-check-reports
          path: android-app/app/build/reports/
          if-no-files-found: ignore
