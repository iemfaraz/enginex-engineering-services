name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp privacy.html index.html dashboard.html email-dashboard.html media-editor.js hero-media.js site-settings.js site-content.js job-documents.js job-tools.js request-extras.js operations.css app.webmanifest ios-install.js service-worker.js offline.html _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
