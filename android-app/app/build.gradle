plugins { id 'com.android.application' }
android {
    namespace 'com.enginex.services'
    compileSdk 36
    defaultConfig {
        applicationId 'com.enginex.services'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    def releaseKey = System.getenv('ENGINEX_KEYSTORE_PATH')
    signingConfigs {
        release {
            if (releaseKey) {
                storeFile file(releaseKey)
                storePassword System.getenv('ENGINEX_STORE_PASSWORD')
                keyAlias System.getenv('ENGINEX_KEY_ALIAS')
                keyPassword System.getenv('ENGINEX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseKey) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true; disable 'SetJavaScriptEnabled','ObsoleteSdkInt' }
}
